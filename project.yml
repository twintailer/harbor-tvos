name: Harbor
options:
  bundleIdPrefix: app.harbor
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
packages:
  # MPVKit contains Harbor's tested tvOS MoltenVK render context. Mainline
  # libmpv builds cannot attach gpu-next to our CAMetalLayer on Apple TV.
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.0.0
  # Binary VLCKit package with a native tvOS slice. This is the same fallback
  # engine used by the supplied Orivio Apple TV reference project.
  VLCKit:
    url: https://github.com/tylerjonesio/vlckit-spm
    from: 3.6.0
  # Prepared by scripts/prepare-ksplayer-lite.py. This is real KSPlayer using
  # KSAVPlayer, without its conflicting optional FFmpeg fallback.
  KSPlayer:
    path: Vendor/KSPlayerLite
targets:
  HarborTV:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Resources/Anime4K
        type: folder
        buildPhase: resources
    dependencies:
      - package: MPVKit
        product: MPVKit-GPL
      - package: VLCKit
        product: VLCKitSPM
      - package: KSPlayer
        product: KSPlayer
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Harbor
        CFBundleShortVersionString: "0.3.8"
        CFBundleVersion: "13"
        UIRequiredDeviceCapabilities: [arm64]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIUserInterfaceStyle: Dark
        # Explicit UIScene adoption — tvOS 26 runs legacy-lifecycle apps in a
        # compatibility mode that has caused AV glitches (StremioX sets this too).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.harbor.tvos
        PRODUCT_NAME: Harbor
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
        ENABLE_BITCODE: false
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
