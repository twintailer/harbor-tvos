name: Harbor
options:
  bundleIdPrefix: app.harbor
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
packages:
  # KSPlayer and Harbor's direct libmpv backend deliberately share one pinned
  # FFmpegKit graph. Linking MPVKit as well would duplicate the Libav* modules,
  # waste memory and fail SwiftPM's package-identity checks.
  FFmpegKit:
    url: https://github.com/kingslay/FFmpegKit.git
    exactVersion: 6.1.4
  # Binary VLCKit package with a native tvOS slice. This is the same fallback
  # engine used by the supplied Orivio Apple TV reference project.
  VLCKit:
    url: https://github.com/tylerjonesio/vlckit-spm
    from: 3.6.0
  # Third selectable playback engine. Pin the tested revision so FFmpeg/Metal
  # behavior cannot change underneath a release build.
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer
    revision: af2e26f68b5bf726463850fe19c23c08a0d56577
targets:
  HarborTV:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Resources/Anime4K
        type: folder
        buildPhase: resources
    dependencies:
      - package: FFmpegKit
        product: libmpv
      - package: VLCKit
        product: VLCKitSPM
      - package: KSPlayer
        product: KSPlayer
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Harbor
        CFBundleShortVersionString: "0.3.7"
        CFBundleVersion: "12"
        UIRequiredDeviceCapabilities: [arm64]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIUserInterfaceStyle: Dark
        # Explicit UIScene adoption — tvOS 26 runs legacy-lifecycle apps in a
        # compatibility mode that has caused AV glitches (StremioX sets this too).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.harbor.tvos
        PRODUCT_NAME: Harbor
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
        ENABLE_BITCODE: false
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
