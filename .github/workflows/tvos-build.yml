name: tvos-build

# Builds an unsigned tvOS IPA of Harbor for Apple TV on a macOS runner.
# Trigger from the Actions tab or: gh workflow run tvos-build.yml
# Installing on Apple TV still requires signing and a paired Mac/Xcode.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Sources/**"
      - "Resources/**"
      - "scripts/**"
      - "project.yml"
      - ".github/workflows/tvos-build.yml"
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Resources/**"
      - "scripts/**"
      - "project.yml"
      - ".github/workflows/tvos-build.yml"

jobs:
  build-tvos:
    name: tvOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install xcodegen
          python3 -m pip install --quiet --user pillow || python3 -m pip install --quiet --break-system-packages pillow

      - name: Generate Apple TV assets
        run: python3 scripts/generate-assets.py

      - name: Bundle pinned Anime4K shaders
        shell: bash
        run: bash scripts/fetch-anime4k.sh

      - name: Prepare conflict-free KSPlayer backend
        run: python3 scripts/prepare-ksplayer-lite.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -project Harbor.xcodeproj -scheme HarborTV \
            -clonedSourcePackagesDirPath spm \
            -resolvePackageDependencies

      - name: Build (unsigned, appletvos)
        run: |
          set -o pipefail
          xcodebuild -project Harbor.xcodeproj -scheme HarborTV \
            -configuration Release -sdk appletvos -destination 'generic/platform=tvOS' \
            -derivedDataPath build -clonedSourcePackagesDirPath spm \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -50

      - name: Package IPA
        run: |
          APP=$(find build -name '*.app' -path '*appletvos*' | head -1)
          echo "APP: $APP"
          test -n "$APP"
          mkdir -p Payload dist
          cp -R "$APP" Payload/
          zip -r -q "dist/Harbor_tvOS_0.4.0_unsigned.ipa" Payload
          ls -la dist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: harbor-tvos
          path: dist/*.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
